<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriano Karaokê - Ferramentas</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { background-color: #0B0A12; color: #FFFFFF; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-x: hidden; }
        
        body.modo-claro { background-color: #4A32A1 !important; color: #FFFFFF !important; }
        body.modo-claro .app-container, body.modo-claro .header-fixo { background-color: #4A32A1 !important; }
        body.modo-claro .header-fixo { border-bottom: 2px solid rgba(0, 0, 0, 0.1) !important; }
        body.modo-claro .menu-inferior { background-color: #4A32A1 !important; border-top: 2px solid rgba(255, 255, 255, 0.2) !important; }
        body.modo-claro .menu-item { color: rgba(255,255,255,0.6) !important; }
        body.modo-claro .menu-item.ativo { color: #00E5FF !important; }
        
        body.modo-claro .card-status, body.modo-claro .modal-senha-container { background-color: #FFFFFF !important; border: 2px solid #00E5FF !important; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3) !important; }
        body.modo-claro .label-status, body.modo-claro .sub-titulo-secao, body.modo-claro .modal-senha-container p { color: #4A32A1 !important; font-weight: 800 !important; }
        body.modo-claro .valor-status { color: #FF0055 !important; font-weight: 800 !important; } 
        body.modo-claro .titulo-tela { color: #00E5FF !important; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        body.modo-claro .btn-sincronizar { background-color: #00E5FF !important; color: #4A32A1 !important; }
        body.modo-claro .btn-limpar-favoritos { background-color: #FF0055 !important; color: #FFFFFF !important; border: none !important; }
        body.modo-claro .btn-chamar-admin { background-color: #4A32A1 !important; color: #00E5FF !important; border: 2px solid #00E5FF !important; }
        body.modo-claro .btn-restaurar { background-color: #FF0055 !important; color: #FFFFFF !important; border: none !important; font-weight: 800 !important; }
        body.modo-claro .input-senha { background-color: #F0F4F8 !important; color: #4A32A1 !important; border: 2px solid #4A32A1 !important; font-weight: bold !important; }
        body.modo-claro .msg-alerta-vermelha { color: #FF0055 !important; font-weight: 900 !important; }
        body.modo-claro .btn-confirmar-senha { background-color: #FF0055 !important; color: #FFFFFF !important; }

        .app-container { width: 100%; max-width: 450px; background-color: #0B0A12; display: flex; flex-direction: column; min-height: 100vh; position: relative; padding-bottom: 90px; }
        
        .header-fixo { position: sticky; top: 0; background-color: #0B0A12; z-index: 100; border-bottom: 2px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; }
        
        .banner-novo-css { width: 100%; height: 80px; background: linear-gradient(135deg, #110e22 0%, #1a153a 50%, #0B0A12 100%); border-bottom: 2px solid #00E5FF; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .banner-novo-css::before { content: ''; position: absolute; top: -30px; left: -20px; width: 100px; height: 100px; background: rgba(0, 229, 255, 0.2); filter: blur(25px); border-radius: 50%; }
        .banner-novo-css::after { content: ''; position: absolute; bottom: -30px; right: -20px; width: 120px; height: 120px; background: rgba(216, 27, 96, 0.15); filter: blur(30px); border-radius: 50%; }
        .banner-conteudo { display: flex; align-items: center; justify-content: flex-start; gap: 15px; z-index: 2; width: 100%; padding: 0 25px; }
        .banner-icone { font-size: 45px; color: #00E5FF; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6)); }
        .banner-textos { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .banner-sub { font-size: 11px; color: #8884A4; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: -2px; }
        
        /* FONTE REDUZIDA PARA NÃO CORTAR O "MINHAS FERRAMENTAS" */
        .banner-titulo-texto { font-size: 21px; font-weight: 900; color: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); line-height: 1.1; white-space: nowrap;}
        
        .destaque-neon { color: #00E5FF; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
        .espacador-header { height: 15px; }
        
        .conteudo-principal { padding: 5px 25px 20px 25px; display: flex; flex-direction: column; gap: 16px; }
        .sub-titulo-secao { font-size: 14px; color: #8884A4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; margin-bottom: 5px; }
        
        .card-status { background-color: #161426; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .linha-status { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .label-status { color: #E2E0EC; font-weight: 500; }
        .valor-status { color: #FFFFFF; font-weight: 600; }
        .barra-fundo { width: 100%; height: 6px; background-color: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; }
        .barra-preenchimento { width: 0%; height: 100%; background: linear-gradient(90deg, #A08CD2, #00E5FF); border-radius: 4px; transition: width 0.4s ease; }
        .texto-progresso { font-size: 12px; color: #00E5FF; text-align: left; font-weight: 500; }
        
        .container-botoes-acao { display: flex; flex-direction: column; gap: 12px; }
        .btn-ferramenta { width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; border: none; transition: transform 0.1s; }
        .btn-ferramenta:active { transform: scale(0.98); }
        .btn-sincronizar { background-color: #00E5FF; color: #000000; }
        .btn-limpar-favoritos { background-color: transparent; color: #FF4D4D; border: 1px solid #FF4D4D; }
        .btn-restaurar { background-color: #161426; color: #FFFFFF; border: 1px solid #FF4D4D; }
        .btn-chamar-admin { background-color: #161426; color: #8884A4; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 15px; font-size: 13px; }
        
        .modal-senha-container { display: none; flex-direction: column; background-color: #161426; border: 1px solid rgba(255, 77, 77, 0.2); border-radius: 12px; padding: 20px; text-align: center; gap: 15px; margin-top: 10px; }
        .msg-alerta-vermelha { color: #FF4D4D; font-weight: 700; font-size: 14px; text-transform: uppercase; }
        .input-senha { width: 100%; background: #0B0A12; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; text-align: center; font-size: 15px; outline: none; }
        .btn-confirmar-senha { background-color: #FF4D4D; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;}
        
        .senha-wrapper { position: relative; display: flex; align-items: center; }
        .senha-wrapper .fa-eye, .senha-wrapper .fa-eye-slash { position: absolute; right: 15px; color: #8884A4; cursor: pointer; font-size: 18px; }

        .menu-inferior { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background-color: #161426; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; padding: 10px 0; height: 60px; align-items: center; z-index: 1000; }
        .menu-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8884A4; text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1;}
        .menu-item.ativo { color: #00E5FF; }
        .menu-item i { font-size: 20px; margin-bottom: 2px; }

        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #00E5FF; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.5s; z-index: 9999; pointer-events: none; }
        .toast-msg.show { opacity: 1; }
        #modal-alerta { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 4000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .caixa-alerta { background: #161426; width: 85%; max-width: 320px; border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header-fixo">
            <div class="banner-novo-css">
                <div class="banner-conteudo">
                    <i class="fa-solid fa-wrench banner-icone"></i>
                    <div class="banner-textos">
                        <span class="banner-sub">Adriano Karaokê</span>
                        <span class="banner-titulo-texto">Minhas <span class="destaque-neon">Ferramentas</span></span>
                    </div>
                </div>
            </div>
            <div class="espacador-header"></div>
        </div>

        <div class="conteudo-principal">
            
            <div class="sub-titulo-secao">Meu Perfil (Nome na Fila)</div>
            <div class="card-status">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="input-meu-nome" class="input-senha" style="flex: 1; text-align: left;" placeholder="Como se chama?">
                    <button class="btn-confirmar-senha" style="background-color: #00E5FF; color: #000;" onclick="salvarNomeUsuario()">Salvar</button>
                </div>
            </div>

            <div class="sub-titulo-secao">Configurações Locais</div>
            <div class="card-status">
                <div class="linha-status">
                    <span class="label-status">Catálogo em Cache:</span>
                    <span class="valor-status" style="color: #FF4D4D;" id="valor-registros">0 registros</span>
                </div>
                <div class="container-progresso">
                    <div class="barra-fundo"><div class="barra-preenchimento" id="progresso-linha"></div></div>
                    <div class="texto-progresso" id="txt-progresso-status">Carregando...</div>
                </div>
            </div>
            
            <div class="container-botoes-acao">
                <button class="btn-ferramenta btn-sincronizar" onclick="sincronizarDados()">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Sincronizar Meu Catálogo
                </button>
                <button class="btn-ferramenta btn-limpar-favoritos" onclick="simularLimpezaLocalStorage()">
                    <i class="fa-solid fa-trash-can"></i> Limpar Meus Favoritos
                </button>
                <button class="btn-ferramenta btn-restaurar" onclick="resetDeFabrica()">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Reset de Emergência
                </button>
            </div>
            
            <button class="btn-ferramenta btn-chamar-admin" id="btn-chamar-painel" onclick="mostrarCaixaSenha()">
                <i class="fa-solid fa-lock"></i> Acessar Painel do Administrador
            </button>
            
            <div class="modal-senha-container" id="caixa-senha-admin">
                <div class="msg-alerta-vermelha"><i class="fa-solid fa-triangle-exclamation"></i> Área Restrita!</div>
                <p style="font-size: 12px; color: #8884A4;">Digite a senha master para acessar a Gestão do Evento.</p>
                <div class="senha-wrapper">
                    <input type="password" id="campo-senha" class="input-senha" placeholder="Senha...">
                    <i class="fa-solid fa-eye" id="icone-olho" onclick="alternarVisibilidadeSenha()"></i>
                </div>
                <button class="btn-confirmar-senha" onclick="verificarSenhaMaster()">Acessar Painel</button>
                <button class="btn-ferramenta" style="background: transparent; color: #8884A4; margin-top: 5px; font-size: 13px;" onclick="cancelarSenha()">Cancelar</button>
            </div>
        </div>
        
        <nav class="menu-inferior">
            <a class="menu-item" onclick="navegarComIP('catalogo.html')"><i class="fa-solid fa-house"></i>Catálogo</a>
            <a class="menu-item" onclick="navegarComIP('favoritos.html')"><i class="fa-solid fa-heart"></i>Favoritos</a>
            <a class="menu-item" onclick="navegarComIP('contato.html')"><i class="fa-solid fa-comments"></i>Contato</a>
            <a class="menu-item ativo" onclick="navegarComIP('ferramentas.html')"><i class="fa-solid fa-gear"></i>Ferramentas</a>
        </nav>
    </div>

    <!-- ALERTA CUSTOMIZADO -->
    <div id="modal-alerta">
        <div class="caixa-alerta">
            <div id="alerta-icone" style="font-size: 45px; color: #00E5FF; margin-bottom: 15px;"><i class="fa-solid fa-circle-info"></i></div>
            <div id="alerta-titulo" style="font-size: 18px; font-weight: bold; color: #FFFFFF; margin-bottom: 10px;">Aviso</div>
            <div id="alerta-mensagem" style="font-size: 14px; color: #8884A4; margin-bottom: 20px; line-height: 1.4;">Mensagem aqui...</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-alerta-cancelar" style="display: none; flex: 1; background: transparent; color: #FF4D4D; border: 1px solid #FF4D4D; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancelar</button>
                <button id="btn-alerta-ok" style="flex: 1; background: #00E5FF; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">OK</button>
            </div>
        </div>
    </div>

    <script>
        const db = new Dexie('KaraokeDB');
        db.version(1).stores({ musicas: '++id,musica,artista,codigo,foto' });

        const urlParams = new URLSearchParams(window.location.search);
        let ipServidor = urlParams.get('ip') || localStorage.getItem('ip_karaoke_puro');

        if (urlParams.has('ip')) { localStorage.setItem('ip_karaoke_puro', urlParams.get('ip')); }

        function navegarComIP(pagina) { window.location.href = ipServidor ? `${pagina}?ip=${ipServidor}` : pagina; }

        function mostrarAlerta(mensagem, titulo = 'Aviso', tipo = 'info', callback = null) {
            document.getElementById('alerta-titulo').innerText = titulo;
            document.getElementById('alerta-mensagem').innerText = mensagem;
            const btnCancelar = document.getElementById('btn-alerta-cancelar');
            const btnOk = document.getElementById('btn-alerta-ok');
            const iconeDiv = document.getElementById('alerta-icone');
            
            let icone = '<i class="fa-solid fa-circle-info"></i>'; let cor = '#00E5FF';
            btnCancelar.style.display = 'none';

            if(tipo === 'erro') { icone = '<i class="fa-solid fa-triangle-exclamation"></i>'; cor = '#FF4D4D'; } 
            else if(tipo === 'sucesso') { icone = '<i class="fa-solid fa-circle-check"></i>'; cor = '#00E676'; } 
            else if(tipo === 'confirmar') { icone = '<i class="fa-solid fa-circle-question"></i>'; cor = '#5A94CB'; btnCancelar.style.display = 'block'; }
            
            iconeDiv.innerHTML = icone; iconeDiv.style.color = cor; btnOk.style.background = cor;
            document.querySelector('.caixa-alerta').style.borderColor = cor;
            
            const modal = document.getElementById('modal-alerta');
            modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = '1', 10);
            
            btnOk.onclick = () => { fecharAlerta(); if(callback) callback(true); };
            btnCancelar.onclick = () => { fecharAlerta(); if(callback) callback(false); };
        }

        function fecharAlerta() {
            const modal = document.getElementById('modal-alerta');
            modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 300);
        }

        function mostrarNotificacao(texto) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg'; toast.innerText = texto;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 3000);
        }

        async function atualizarContadorStatus() {
            const count = await db.musicas.count();
            document.getElementById('valor-registros').innerText = count + " registros";
            if(count > 0) {
                document.getElementById('progresso-linha').style.width = "100%";
                document.getElementById('txt-progresso-status').innerText = "Sistema otimizado.";
            }
        }

        function carregarNomeUsuario() {
            const nomeSalvo = localStorage.getItem('AdrianoKaraokeNomeCliente');
            if (nomeSalvo) document.getElementById('input-meu-nome').value = nomeSalvo;
        }

        function salvarNomeUsuario() {
            const novoNome = document.getElementById('input-meu-nome').value.trim();
            if (novoNome === "") {
                mostrarAlerta("Digite um nome válido.", "Aviso", "erro");
                return;
            }
            localStorage.setItem('AdrianoKaraokeNomeCliente', novoNome);
            mostrarNotificacao("Seu nome foi atualizado com sucesso!");
        }

        async function sincronizarDados() {
            const txtStatus = document.getElementById('txt-progresso-status');
            const barra = document.getElementById('progresso-linha');
            const valorRegistros = document.getElementById('valor-registros');
            
            barra.style.width = "30%";
            txtStatus.innerText = "Baixando catálogo do servidor...";
            
            try {
                const resp = await fetch('https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/catalogo_final_pronto.json');
                const novasMusicas = await resp.json();
                
                await db.musicas.clear();
                await db.musicas.bulkPut(novasMusicas);
                
                barra.style.width = "100%";
                txtStatus.innerText = "Pronto! Catálogo atualizado.";
                valorRegistros.innerText = novasMusicas.length + " registros";
                
                mostrarAlerta("Catálogo sincronizado com sucesso. Você tem as músicas mais recentes!", "Sucesso", "sucesso");
            } catch (e) {
                txtStatus.innerText = "Erro na sincronização.";
                mostrarAlerta("Erro ao conectar ao servidor. Verifique sua internet.", "Erro", "erro");
            }
        }

        function simularLimpezaLocalStorage() {
            mostrarAlerta("Deseja apagar os favoritos salvos NESTE celular?", "Limpar Favoritos", "confirmar", (confirmado) => {
                if(confirmado) { localStorage.removeItem('meusFavoritos'); mostrarNotificacao("Favoritos deste aparelho limpos!"); }
            });
        }

        function alternarVisibilidadeSenha() {
            const campo = document.getElementById('campo-senha');
            const icone = document.getElementById('icone-olho');
            if (campo.type === "password") {
                campo.type = "text";
                icone.classList.remove('fa-eye');
                icone.classList.add('fa-eye-slash');
            } else {
                campo.type = "password";
                icone.classList.remove('fa-eye-slash');
                icone.classList.add('fa-eye');
            }
        }

        function mostrarCaixaSenha() {
            if (sessionStorage.getItem('adminAutenticado') === 'true') {
                navegarComIP('admin.html');
            } else {
                document.getElementById('caixa-senha-admin').style.display = 'flex';
                document.getElementById('btn-chamar-painel').style.display = 'none';
            }
        }

        function cancelarSenha() {
            document.getElementById('caixa-senha-admin').style.display = 'none';
            document.getElementById('btn-chamar-painel').style.display = 'flex';
            document.getElementById('campo-senha').value = "";
        }

        function verificarSenhaMaster() {
            let senha = document.getElementById('campo-senha').value;
            if(senha === "aca301171") {
                sessionStorage.setItem('adminAutenticado', 'true');
                navegarComIP('admin.html');
            } else {
                mostrarAlerta("Senha incorreta! Acesso negado.", "Erro de Segurança", "erro");
                document.getElementById('campo-senha').value = "";
            }
        }

        async function resetDeFabrica() {
            mostrarAlerta("ATENÇÃO: Isso vai apagar e recriar todo o banco de dados do seu Karaokê. Deseja continuar?", "Reset de Emergência", "confirmar", async (confirmado) => {
                if (confirmado) {
                    const txtStatus = document.getElementById('txt-progresso-status');
                    const barra = document.getElementById('progresso-linha');
                    
                    barra.style.width = "10%"; txtStatus.innerText = "Limpando memória...";
                    
                    try {
                        await db.musicas.clear();
                        localStorage.removeItem('ultimoTotalConhecido');
                        localStorage.removeItem('quantidadeNovasFixa');
                        
                        barra.style.width = "50%"; txtStatus.innerText = "Baixando catálogo limpo...";
                        const timestamp = new Date().getTime();
                        const resp = await fetch(`https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/catalogo_final_pronto.json?t=${timestamp}`);
                        const musicasLimpas = await resp.json();
                        
                        barra.style.width = "80%"; txtStatus.innerText = "Recriando banco de dados...";
                        await db.musicas.bulkPut(musicasLimpas);
                        
                        barra.style.width = "100%"; txtStatus.innerText = "Sistema restaurado com sucesso!";
                        document.getElementById('valor-registros').innerText = musicasLimpas.length + " registros";
                        
                        mostrarAlerta("Seu sistema está limpo, recalibrado e 100% atualizado.", "Reset Concluído", "sucesso");
                    } catch (e) {
                        txtStatus.innerText = "Falha ao restaurar.";
                        mostrarAlerta("Erro crítico: Verifique sua conexão com a internet para baixar o catálogo limpo.", "Falha Grave", "erro");
                    }
                }
            });
        }

        window.onload = () => {
            if(localStorage.getItem('tema') === 'modo-claro') { 
                document.body.classList.add('modo-claro');
            }
            atualizarContadorStatus();
            carregarNomeUsuario();
        };
    </script>
</body>
</html>
