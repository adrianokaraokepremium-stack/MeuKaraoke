<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriano Karaokê - Músicas Novas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { background-color: #0B0A12; color: #FFFFFF; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; padding-bottom: 80px; }
        
        body.modo-claro { background-color: #4A32A1 !important; }
        body.modo-claro .app-container { background-color: #4A32A1 !important; }
        body.modo-claro .btn-titulo, body.modo-claro .card-musica { background-color: #FFFFFF !important; color: #333333 !important; border: 1px solid #CCCCCC !important; }
        body.modo-claro .txt-musica { color: #000000 !important; }
        body.modo-claro .txt-label { color: #546E7A !important; }
        body.modo-claro .txt-cantor { color: #007BFF !important; } 
        body.modo-claro .txt-codigo { color: #D81B60 !important; }
        body.modo-claro .menu-inferior { background-color: #4A32A1 !important; }

        .app-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; }
        
        .header-fixo { position: sticky; top: 0; background-color: #0B0A12; z-index: 100; padding-bottom: 5px; border-bottom: 2px solid rgba(255, 255, 255, 0.05); }
        body.modo-claro .header-fixo { background-color: #4A32A1 !important; border-bottom: 2px solid rgba(0, 0, 0, 0.1) !important; }

        /* BANNER COM ÍCONE PRÓXIMO E TEXTO ALINHADO À ESQUERDA */
        .banner-novo-css {
            width: 100%; height: 80px; 
            background: linear-gradient(135deg, #110e22 0%, #1a153a 50%, #0B0A12 100%);
            border-bottom: 2px solid #D81B60;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .banner-novo-css::before { content: ''; position: absolute; top: -30px; left: -20px; width: 100px; height: 100px; background: rgba(0, 229, 255, 0.15); filter: blur(25px); border-radius: 50%; }
        .banner-novo-css::after { content: ''; position: absolute; bottom: -30px; right: -20px; width: 120px; height: 120px; background: rgba(216, 27, 96, 0.15); filter: blur(30px); border-radius: 50%; }
        
        .banner-conteudo { display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 2; width: 100%; padding: 0 15px; }
        .banner-icone { font-size: 45px; color: #00E5FF; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6)); }
        .banner-textos { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .banner-sub { font-size: 11px; color: #8884A4; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: -2px; }
        .banner-titulo-texto { font-size: 24px; font-weight: 900; color: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); line-height: 1.1;}
        .destaque-neon { color: #D81B60; text-shadow: 0 0 15px rgba(216, 27, 96, 0.6); }
        
        .btn-titulo { background: #161426; color: #FFFFFF; margin: 15px; padding: 15px; border-radius: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; font-weight: bold; font-size: 18px; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .lista-musicas { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .card-musica { background-color: #161426; border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 5px solid #5A94CB; }
        .avatar-artista { width: 55px; height: 55px; border-radius: 10px; cursor: pointer; object-fit: cover; }
        
        .musica-detalhes { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .musica-detalhes div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .txt-label { font-size: 13px; color: #8884A4; font-weight: 500; }
        .txt-musica { font-size: 15px; color: #FFFFFF; font-weight: 700; } 
        .txt-cantor { font-size: 15px; color: #5A94CB; font-weight: 700; } 
        .txt-codigo { font-size: 15px; color: #FF4D4D; font-weight: 700; } 
        
        .musica-acoes { display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0; margin-left: 10px; }
        .icone-play { font-size: 26px; color: #00E676; cursor: pointer; } 
        .acoes-secundarias { display: flex; gap: 20px; font-size: 20px; cursor: pointer; }
        .icone-share { color: #5A94CB; } 
        .icone-heart { color: #FF4D4D; }
        
        .menu-inferior { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background-color: #161426; border-top: 2px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; align-items: center; height: 60px; z-index: 1000; }
        .menu-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8884A4; text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .menu-item i { font-size: 20px !important; margin-bottom: 2px; display: block; }
        .menu-item.ativo { color: #FFFFFF; }

        #modal-pedido { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #modal-pedido.ativo { opacity: 1; pointer-events: auto; }
        .caixa-modal { background: #161426; border: 2px solid #5A94CB; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; }
        .input-nome { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #5A94CB; background: #0B0A12; color: #FFF; font-size: 16px; margin: 15px 0; text-align: center; text-transform: uppercase; }
        .btn-enviar { background: #00E5FF; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; text-transform: uppercase; }
        .btn-cancelar { background: transparent; color: #8884A4; border: none; padding: 10px; margin-top: 10px; cursor: pointer; text-decoration: underline; }

        /* CAIXA DE ALERTA CUSTOMIZADA */
        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #00E5FF; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.5s; z-index: 9999; pointer-events: none; }
        .toast-msg.show { opacity: 1; }
        
        #modal-alerta { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 4000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .caixa-alerta { background: #161426; width: 85%; max-width: 320px; border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-fixo">
            
            <div class="banner-novo-css">
                <div class="banner-conteudo">
                    <i class="fa-solid fa-compact-disc banner-icone fa-spin" style="--fa-animation-duration: 5s;"></i>
                    <div class="banner-textos">
                        <span class="banner-sub">Adriano Karaokê</span>
                        <span class="banner-titulo-texto">Músicas <span class="destaque-neon">Novas</span></span>
                    </div>
                </div>
            </div>

            <div class="btn-titulo">
                <i class="fa-solid fa-folder-open"></i> Últimas Adições <span id="contador-novas" style="color: #FF4D4D;"></span>
            </div>
        </div>
        
        <div class="lista-musicas" id="container-novas"></div>

        <nav class="menu-inferior">
            <a class="menu-item" onclick="navegarComIP('catalogo.html')"><i class="fa-solid fa-house"></i>Catálogo</a>
            <a class="menu-item" onclick="navegarComIP('favoritos.html')"><i class="fa-solid fa-heart"></i>Favoritos</a>
            <a class="menu-item" onclick="navegarComIP('contato.html')"><i class="fa-solid fa-comments"></i>Contato</a>
            <a class="menu-item" onclick="navegarComIP('ferramentas.html')"><i class="fa-solid fa-gear"></i>Ferramentas</a>
        </nav>
    </div>

    <!-- MODAIS -->
    <div id="modal-pedido">
        <div class="caixa-modal">
            <h3 style="color: #00E5FF; margin-bottom: 5px;">Cantar Música</h3>
            <p id="txt-modal-musica" style="font-size: 14px; color: #FFF; margin-bottom: 10px;"></p>
            <input type="text" id="input-cliente" class="input-nome" placeholder="Digite o seu Nome" maxlength="20">
            <button class="btn-enviar" onclick="enviarPedidoParaTV()">Enviar Pedido</button>
            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <!-- ALERTA CUSTOMIZADO -->
    <div id="modal-alerta">
        <div class="caixa-alerta">
            <div id="alerta-icone" style="font-size: 45px; color: #00E5FF; margin-bottom: 15px;"><i class="fa-solid fa-circle-info"></i></div>
            <div id="alerta-titulo" style="font-size: 18px; font-weight: bold; color: #FFFFFF; margin-bottom: 10px;">Aviso</div>
            <div id="alerta-mensagem" style="font-size: 14px; color: #8884A4; margin-bottom: 20px; line-height: 1.4;">Mensagem aqui...</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-alerta-cancelar" style="display: none; flex: 1; background: transparent; color: #FF4D4D; border: 1px solid #FF4D4D; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancelar</button>
                <button id="btn-alerta-ok" style="flex: 1; background: #00E5FF; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">OK</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let ipServidor = urlParams.get('ip');

        function navegarComIP(pagina) {
            if (ipServidor) {
                window.location.href = `${pagina}?ip=${ipServidor}`;
            } else {
                window.location.href = pagina;
            }
        }

        // SISTEMA DE ALERTAS CUSTOMIZADOS
        function mostrarAlerta(mensagem, titulo = 'Aviso', tipo = 'info', callback = null) {
            document.getElementById('alerta-titulo').innerText = titulo;
            document.getElementById('alerta-mensagem').innerText = mensagem;
            
            const btnCancelar = document.getElementById('btn-alerta-cancelar');
            const btnOk = document.getElementById('btn-alerta-ok');
            const iconeDiv = document.getElementById('alerta-icone');
            
            let icone = '<i class="fa-solid fa-circle-info"></i>';
            let cor = '#00E5FF';
            
            btnCancelar.style.display = 'none';

            if(tipo === 'erro') { 
                icone = '<i class="fa-solid fa-triangle-exclamation"></i>'; cor = '#FF4D4D'; 
            } else if(tipo === 'sucesso') { 
                icone = '<i class="fa-solid fa-circle-check"></i>'; cor = '#00E676'; 
            } else if(tipo === 'confirmar') {
                icone = '<i class="fa-solid fa-circle-question"></i>'; cor = '#5A94CB';
                btnCancelar.style.display = 'block';
            }
            
            iconeDiv.innerHTML = icone;
            iconeDiv.style.color = cor;
            btnOk.style.background = cor;
            document.querySelector('.caixa-alerta').style.borderColor = cor;
            
            const modal = document.getElementById('modal-alerta');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
            
            btnOk.onclick = () => { fecharAlerta(); if(callback) callback(true); };
            btnCancelar.onclick = () => { fecharAlerta(); if(callback) callback(false); };
        }

        function fecharAlerta() {
            const modal = document.getElementById('modal-alerta');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function mostrarNotificacao(texto) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = texto;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 3000);
        }

        let codigoAtualParaPedir = "";

        window.onload = () => {
            if(localStorage.getItem('tema') === 'modo-claro') document.body.classList.add('modo-claro');
            carregarNovas();
            const nomeSalvo = localStorage.getItem('AdrianoKaraokeNomeCliente');
            if(nomeSalvo) document.getElementById('input-cliente').value = nomeSalvo;
        };

        async function carregarNovas() {
            try {
                const resp = await fetch('https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/catalogo_final_pronto.json');
                const musicas = await resp.json();
                
                const container = document.getElementById('container-novas');
                const totalAtualGitHub = musicas.length;

                let ultimoTotal = parseInt(localStorage.getItem('ultimoTotalConhecido')) || 0;
                let qtdNovas = parseInt(localStorage.getItem('quantidadeNovasFixa')) || 20; 

                if (ultimoTotal === 0) {
                    localStorage.setItem('ultimoTotalConhecido', totalAtualGitHub);
                    localStorage.setItem('quantidadeNovasFixa', 20);
                    qtdNovas = 20;
                } else if (totalAtualGitHub > ultimoTotal) {
                    qtdNovas = totalAtualGitHub - ultimoTotal; 
                    localStorage.setItem('quantidadeNovasFixa', qtdNovas);
                    localStorage.setItem('ultimoTotalConhecido', totalAtualGitHub);
                } else if (totalAtualGitHub < ultimoTotal) {
                    localStorage.setItem('ultimoTotalConhecido', totalAtualGitHub);
                }

                const ultimas = musicas.slice(-qtdNovas);
                document.getElementById('contador-novas').innerText = `(${qtdNovas})`;

                const favs = JSON.parse(localStorage.getItem('meusFavoritos')) || [];

                ultimas.reverse().forEach(m => {
                    const urlFoto = m.foto ? `https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/assets/artistas/${m.foto}` : `https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/assets/imagens/sem-foto.webp`;
                    const urlErro = `https://raw.githubusercontent.com/adrianokaraokepremium-stack/MeuKaraoke/refs/heads/main/assets/imagens/sem-foto.webp`;

                    const isFav = favs.includes(String(m.codigo));
                    const iconeCoração = isFav ? 'fa-solid' : 'fa-regular';

                    container.innerHTML += `
                        <div class="card-musica">
                            <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
                                <img src="${urlFoto}" class="avatar-artista" onerror="this.onerror=null; this.src='${urlErro}'" onclick="abrirMidia('${m.musica}', '${m.artista}', '${m.codigo}')">
                                <div class="musica-detalhes">
                                    <div><span class="txt-label">Música:</span> <span class="txt-musica">${m.musica}</span></div>
                                    <div><span class="txt-label">Artista:</span> <span class="txt-cantor">${m.artista}</span></div>
                                    <div><span class="txt-label">Código:</span> <span class="txt-codigo">${m.codigo}</span></div>
                                </div>
                            </div>
                            <div class="musica-acoes">
                                <i class="fa-solid fa-circle-play icone-play" onclick="abrirModalPedido('${m.codigo}', '${m.musica.replace(/'/g, "\\'")}')"></i>
                                <div class="acoes-secundarias">
                                    <i class="fa-solid fa-share-nodes icone-share" onclick="compartilharMusica('${m.musica.replace(/'/g, "\\'")}', '${m.codigo}')"></i>
                                    <i class="${iconeCoração} fa-heart icone-heart" onclick="toggleFavorito(this, '${m.codigo}')"></i>
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) { console.error("Erro ao carregar novas:", e); }
        }

        function abrirModalPedido(codigo, nomeMusica) {
            if (!ipServidor) {
                mostrarAlerta("Você precisa ler o QR Code da tela da TV primeiro para conectar o seu celular!", "Atenção", "erro");
                return;
            }
            codigoAtualParaPedir = codigo;
            document.getElementById('txt-modal-musica').innerText = `Deseja cantar ${nomeMusica}?`;
            document.getElementById('modal-pedido').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modal-pedido').classList.remove('ativo');
        }

        function enviarPedidoParaTV() {
            const cliente = document.getElementById('input-cliente').value.trim();
            if (!cliente) { mostrarAlerta("Por favor, digite o seu nome para cantar!", "Atenção", "erro"); return; }

            localStorage.setItem('AdrianoKaraokeNomeCliente', cliente);

            fetch(`http://${ipServidor}:5000/receber_pedido`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo: codigoAtualParaPedir, cliente: cliente })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    mostrarNotificacao('🎵 Pedido confirmado na tela!');
                    fecharModal();
                } else {
                    mostrarAlerta("Erro ao enviar pedido para a TV.", "Erro", "erro");
                }
            })
            .catch(error => {
                mostrarAlerta("Falha de conexão com a TV. Verifique se está na mesma rede Wi-Fi.", "Erro de Conexão", "erro");
            });
        }

        function toggleFavorito(el, codigo) { 
            let favs = JSON.parse(localStorage.getItem('meusFavoritos')) || [];
            codigo = String(codigo);
            el.classList.toggle('fa-solid'); 
            el.classList.toggle('fa-regular'); 
            if(el.classList.contains('fa-solid')) {
                if(!favs.includes(codigo)) favs.push(codigo);
            } else {
                favs = favs.filter(c => c !== codigo);
            }
            localStorage.setItem('meusFavoritos', JSON.stringify(favs));
        }

        function compartilharMusica(musica, codigo) { 
            const textoParaCopiar = `Vou cantar ${musica} (Cód: ${codigo}) no Adriano Karaokê!`;
            let textArea = document.createElement("textarea");
            textArea.value = textoParaCopiar;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                mostrarNotificacao("🎵 Copiado! Cole no seu WhatsApp ou Instagram.");
            } catch (err) {
                mostrarAlerta("Não foi possível copiar o texto automaticamente.", "Erro", "erro");
            }
            textArea.remove();
        }

        function abrirMidia(m, c, cod) { navegarComIP(`midia.html?musica=${encodeURIComponent(m)}&artista=${encodeURIComponent(c)}&codigo=${encodeURIComponent(cod)}`); }
    </script>
</body>
</html>
