<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriano Karaokê - Contato e Redes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: #0B0A12; color: #FFFFFF; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; }
        
        /* MODO CLARO - FORÇADO COM !IMPORTANT */
        body.modo-claro { background-color: #4A32A1 !important; }
        body.modo-claro .app-container { background-color: #4A32A1 !important; }
        body.modo-claro .btn-rede-social { background-color: #FFFFFF !important; color: #333333 !important; border: 1px solid #CCCCCC !important; }
        body.modo-claro .titulo-contato { color: #FFFFFF !important; }
        body.modo-claro .menu-inferior { background-color: #4A32A1 !important; }

        .app-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* === CABEÇALHO FIXO === */
        .header-fixo {
            position: sticky;
            top: 0;
            background-color: #0B0A12;
            z-index: 100;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }
        body.modo-claro .header-fixo { background-color: #4A32A1 !important; border-bottom: 2px solid rgba(0, 0, 0, 0.1) !important; }

        /* BANNER CSS (CONTATOS) */
        .banner-novo-css {
            width: 100%; height: 80px; 
            background: linear-gradient(135deg, #110e22 0%, #1a153a 50%, #0B0A12 100%);
            border-bottom: 2px solid #00E5FF;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .banner-novo-css::before { content: ''; position: absolute; top: -30px; left: -20px; width: 100px; height: 100px; background: rgba(0, 229, 255, 0.2); filter: blur(25px); border-radius: 50%; }
        .banner-novo-css::after { content: ''; position: absolute; bottom: -30px; right: -20px; width: 120px; height: 120px; background: rgba(216, 27, 96, 0.15); filter: blur(30px); border-radius: 50%; }
        
        .banner-conteudo { display: flex; align-items: center; justify-content: center; gap: 20px; z-index: 2; width: 100%; padding: 0 15px; }
        .banner-icone { font-size: 45px; color: #00E5FF; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6)); }
        .banner-textos { display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .banner-sub { font-size: 11px; color: #8884A4; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: -2px; }
        .banner-titulo-texto { font-size: 24px; font-weight: 900; color: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); line-height: 1.1;}
        .destaque-neon { color: #00E5FF; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
        
        .titulo-contato { text-align: center; font-size: 22px; font-weight: 700; color: #5A94CB; margin: 20px 0 10px 0; } 
        .botoes-redes-container { display: flex; flex-direction: column; gap: 16px; padding: 20px 25px; }

        .btn-rede-social { width: 100%; background-color: #161426; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer; }
        .icone-rede-box { width: 40px; font-size: 24px; color: #5A94CB; }
        .texto-rede-box { flex: 1; padding-left: 5px; }
        .seta-rede-box { font-size: 14px; color: #FF4D4D; opacity: 0.7; }

        .menu-inferior { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background-color: #161426; border-top: 2px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-around; padding: 10px 0; height: 60px; align-items: center; z-index: 1000; }
        .menu-item { display: flex; flex-direction: column; align-items: center; color: #8884A4; text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .menu-item i { font-size: 20px; margin-bottom: 2px; }
        .menu-item.ativo { color: #FFFFFF; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-fixo">
            
            <div class="banner-novo-css">
                <div class="banner-conteudo">
                    <!-- ÍCONE DE AGENDA PARA OS CONTATOS -->
                    <i class="fa-solid fa-address-book banner-icone"></i>
                    <div class="banner-textos">
                        <span class="banner-sub">Adriano Karaokê</span>
                        <span class="banner-titulo-texto">Fale <span class="destaque-neon">Conosco</span></span>
                    </div>
                </div>
            </div>

            <h2 class="titulo-contato">Redes Sociais</h2>
        </div>
        
        <div class="botoes-redes-container">
            <a href="https://wa.me/5521978764422?text=Ol%C3%A1%20tudo%20bem%20%3F%20Como%20posso%20ajudar%20%3F" target="_blank" class="btn-rede-social">
                <div class="icone-rede-box"><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i></div>
                <div class="texto-rede-box">Falar no WhatsApp</div>
                <div class="seta-rede-box"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
            
            <a href="https://instagram.com/adrianokaraoke" target="_blank" class="btn-rede-social">
                <div class="icone-rede-box"><i class="fa-brands fa-instagram" style="color: #E1306C;"></i></div>
                <div class="texto-rede-box">Siga no Instagram</div>
                <div class="seta-rede-box"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
            
            <a href="https://facebook.com/adrianokaraoke" target="_blank" class="btn-rede-social">
                <div class="icone-rede-box"><i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i></div>
                <div class="texto-rede-box">Curta no Facebook</div>
                <div class="seta-rede-box"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
            
            <a href="tel:5521978764422" class="btn-rede-social">
                <div class="icone-rede-box"><i class="fa-solid fa-phone" style="color: #00E5FF;"></i></div>
                <div class="texto-rede-box">Ligar para Adriano Karaokê</div>
                <div class="seta-rede-box"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
        </div>

        <nav class="menu-inferior">
            <a class="menu-item" onclick="navegarComIP('catalogo.html')"><i class="fa-solid fa-house"></i>Catálogo</a>
            <a class="menu-item" onclick="navegarComIP('favoritos.html')"><i class="fa-solid fa-heart"></i>Favoritos</a>
            <a class="menu-item ativo" onclick="navegarComIP('contato.html')"><i class="fa-solid fa-comments"></i>Contato</a>
            <a class="menu-item" onclick="navegarComIP('ferramentas.html')"><i class="fa-solid fa-gear"></i>Ferramentas</a>
        </nav>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let ipServidor = urlParams.get('ip');

        function navegarComIP(pagina) {
            if (ipServidor) {
                window.location.href = `${pagina}?ip=${ipServidor}`;
            } else {
                window.location.href = pagina;
            }
        }

        setTimeout(function() {
            if(localStorage.getItem('tema') === 'modo-claro') {
                document.body.classList.add('modo-claro');
            }
        }, 50); 
    </script>
</body>
</html>
